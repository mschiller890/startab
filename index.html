<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>startab</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="loading-screen">
      <div id="loading-spinner"></div>
      <p id="loading-text"><Loading class=""></Loading></p>
    </div>

    <div id="snackbar-container"></div>

    <div id="mini-clock">
      <p id="mini-time">00:00</p>
      <p id="mini-date"></p>
    </div>

    <div id="weather-overlay"></div>

    <div id="weather-widget">
      <div id="weather-summary">
        <span id="weather-icon"></span>
        <span id="weather-temp">Loading</span>
      </div>
      <div id="weather-details">
        <p id="weather-place">Locating...</p>
        <div id="weather-forecast"></div>
      </div>
    </div>

    <section id="app">
      <video id="hero-video" muted loop playsinline></video>
      <iframe id="hero-embed" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>

      <div id="clock">
        <p id="time">00:00</p>
        <p id="date">Thursday, January 1, 1970</p>
      </div>

      <div id="search-bar">
          <img
              id="search-logo"
              src="https://www.google.com/favicon.ico"
              alt="Google"
          />
          <input
              type="text"
              id="search-input"
              placeholder="Search Google..."
          />
      </div>

      <div id="shortcuts">

      </div>

      <button id="info-button">
        <span id="info-button-label">More info</span>
        <svg id="info-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 9l6 6 6-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </section>

    <section id="info-section">
      <div id="image-info">
          <h2 id="info-title"></h2>
          <p id="info-date"></p>
          <p id="info-description"></p>
          <p id="info-copyright"></p>
      </div>
    </section>

      <div id="modal-overlay">
        <div id="modal">
            <h2 id="modal-title">Add Shortcut</h2>

            <input id="modal-input-1" placeholder="Website URL">
            <input id="modal-input-2" placeholder="Shortcut name">
            <input id="modal-input-3" placeholder="Icon URL (optional)">

            <div id="modal-buttons">
                <button id="modal-cancel">Cancel</button>
                <button id="modal-confirm">Confirm</button>
            </div>
        </div>
      </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
